name: fraud-platform
x-app: &app
  image: fraud-platform:local
  build: .
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
services:
  db:
    image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    environment:
      POSTGRES_DB: fraud_demo
      POSTGRES_USER: fraud_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fraud_owner -d fraud_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No database port published to the host.
  migrate:
    <<: *app
    command: [python, -m, database.migrate]
    environment: &db-env
      DB_HOST: db
      DB_NAME: fraud_demo
      DB_USER: fraud_owner
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    environment: *db-env
    secrets:
      - db_password
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  dashboard:
    <<: *app
    command: [python, -m, streamlit, run, dashboard/app.py, --server.address, 0.0.0.0, --server.port, "8501"]
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
secrets:
  db_password:
    file: .secrets/db_password
volumes:
  db_data:
