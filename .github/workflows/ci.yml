name: Verified portfolio build
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: fraud_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: fraud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud_ci -d fraud_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FRAUD_TEST_DATABASE_URL: postgresql+psycopg://fraud_ci:ephemeral-ci-only@127.0.0.1:5432/fraud_test
      OPENBLAS_NUM_THREADS: '2'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Check repository and lint
        run: |
          python scripts/check_repository.py
          python scripts/check_workflow.py
          python -m ruff check .
      - name: Acquire and verify accepted data
        run: |
          python -m model.download
          python -m model.ingest
      - name: Restore frozen model without reopening test selection
        run: python scripts/restore_model.py
      - name: Test all components; skips fail the gate
        run: python scripts/ci_verify.py
      - name: Upload verified model for container job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-model-${{ github.sha }}
          path: artifacts/model.joblib
          if-no-files-found: error
          retention-days: 7
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-evidence-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
  compose:
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trusted-model-${{ github.sha }}
          path: artifacts/
      - name: Verify artifact and configure local secret
        run: python scripts/prepare_compose.py
      - name: Build and launch
        run: |
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 180
      - name: Verify persistence and restart
        run: python scripts/verify_compose.py
      - name: Collect runtime evidence
        if: always()
        run: |
          mkdir -p reports
          docker compose ps -a > reports/compose-ps.txt
          docker compose logs --no-color > reports/compose.log
          cp docs/evidence/compose-runtime.json reports/ 2>/dev/null || true
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-evidence-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
      - name: Clean up disposable CI resources
        if: always()
        run: docker compose down --volumes --remove-orphans
